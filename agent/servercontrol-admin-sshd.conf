# Keep the owner's normal LAN login on port 22.  The router exposes only the
# dedicated listener below, where every account except the application account
# is rejected before authentication.
Port 22
Port 2222

Match LocalPort 2222
    AllowUsers servercontrol-admin servercontrol-minecraft
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    PermitTTY yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

Match all

Match User servercontrol-admin,servercontrol-minecraft
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    PermitTTY yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

Match all
