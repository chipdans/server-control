name: Promote Server Control beta 6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-beta6.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark beta 6 as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0-beta.6 --repo "${{ github.repository }}" --prerelease=false --latest
