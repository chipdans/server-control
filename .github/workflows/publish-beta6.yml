name: Publish Server Control beta 6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-beta6.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start verified Windows release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f tag=v2.0.0-beta.6
