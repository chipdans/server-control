name: Promote Server Control beta 5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-beta5.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Publish beta 5 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0-beta.5 --repo "${{ github.repository }}" --prerelease=false --latest
