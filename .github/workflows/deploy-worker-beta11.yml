name: Deploy Server Control Hub beta 11

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-worker-beta11.yml]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 2; }

      - name: Install Wrangler
        working-directory: worker
        run: npm ci

      - name: Resolve production D1 database and deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 list --json > d1.json
          D1_DATABASE_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('d1.json','utf8'));const a=Array.isArray(x)?x:(x.result||[]);const d=a.find(v=>v.name==='server-control');if(!d)process.exit(3);process.stdout.write(d.uuid||d.id||'')")"
          test -n "$D1_DATABASE_ID" || { echo "D1 database server-control was not found"; exit 3; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
          npx wrangler deploy --keep-vars
