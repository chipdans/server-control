name: Start beta 17 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-beta17.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo chipdans/server-control --ref main -f tag=v2.0.0-beta.17
