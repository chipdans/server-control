name: Promote Server Control beta 10

on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-beta10.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark beta 10 as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0-beta.10 --repo "${{ github.repository }}" --prerelease=false --latest
