name: Publish beta 14

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-beta14.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.0.0-beta.14
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}"

      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f tag=v2.0.0-beta.14
