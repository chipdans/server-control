name: Promote beta 14

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-beta14.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Make release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0-beta.14 --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest
