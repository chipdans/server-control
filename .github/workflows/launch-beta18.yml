name: Launch beta.18 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/launch-beta18.yml]
permissions:
  contents: read
  actions: write
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Start the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/chipdans/server-control/actions/workflows/release.yml/dispatches -f ref=main -f 'inputs[tag]=v2.0.0-beta.18'
