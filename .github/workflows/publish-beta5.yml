name: Publish Server Control beta 5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-beta5.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start beta 5 release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f tag=v2.0.0-beta.5
