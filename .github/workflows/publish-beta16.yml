name: Publish beta 16 once

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-beta16.yml]

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-beta-16-once
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment script syntax without deploying
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/worker/deploy-quota-fix.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Build and publish beta 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_status=$(gh run view 33880924130 --json status --jq .status)
          if [ "$old_status" != "completed" ]; then
            gh run cancel 33880924130
          fi
          previous_run_id=$(gh run list --workflow release.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          gh workflow run release.yml --ref main -f tag=v2.0.0-beta.16
          run_id=""
          for attempt in $(seq 1 30); do
            candidate=$(gh run list --workflow release.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$candidate" ] && [ "$candidate" != "$previous_run_id" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
          gh release edit v2.0.0-beta.16 --prerelease=false --latest --title 'v2.0.0-beta.16 — D1 quota fix' --notes 'Исправлен перерасход Cloudflare D1: индексы для очистки истории и очередей, очистка раз в час небольшими порциями, понятная ошибка квоты, пауза запросов клиента и Agent 2.0.6. Пройдены 58 Python-тестов и 20 тестов Worker. Важно: действующий Cloudflare Worker и индексы базы обновляются отдельно скриптом worker/deploy-quota-fix.ps1 после восстановления квоты. Разделение переводов в этот выпуск не входит.'

      - name: Remove this workflow and synchronize branches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-beta16.yml
          git commit -m "Remove one-time beta 16 publication workflow"
          git push --atomic origin HEAD:main HEAD:v2
