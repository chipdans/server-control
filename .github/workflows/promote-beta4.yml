name: Promote Server Control beta 4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-beta4.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Publish beta 4 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0-beta.4 --repo "${{ github.repository }}" --prerelease=false --latest
