name: Promote Server Control beta 9

on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-beta9.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark beta 9 as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0-beta.9 --repo "${{ github.repository }}" --prerelease=false --latest
