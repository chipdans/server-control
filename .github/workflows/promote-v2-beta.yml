name: Promote Server Control 2 beta 2

on:
  push:
    branches:
      - "v2"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Make beta 2 the latest primary release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: >-
          gh release edit v2.0.0-beta.2
          --repo "${{ github.repository }}"
          --prerelease=false
          --latest
