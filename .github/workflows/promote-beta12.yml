name: Promote Server Control beta 12

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-beta12.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark beta 12 as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0-beta.12 --repo "${{ github.repository }}" --prerelease=false --latest
